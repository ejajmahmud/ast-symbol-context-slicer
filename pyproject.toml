[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-symbol-context-slicer"
version = "0.1.0"
description = "Extracts minimal dependency-closed Python AST symbol slices to fit strict LLM context budgets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ast-symbol-context-slicer = "ast_symbol_context_slicer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_symbol_context_slicer*"]
